<section id="benefits" class="py-24" style="background: #0a0a0a;" aria-labelledby="benefits-title">
  <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">

    <div class="text-center mb-14">
      <div appReveal class="section-tag inline-flex reveal">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="#F5C400" aria-hidden="true"><path d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z" /></svg>
        Por qué elegirnos
      </div>
      <h2 id="benefits-title" appReveal class="section-title mt-4 reveal delay-100">
        Los beneficios de trabajar<br />
        con <span class="text-yellow">MECAFUTURO</span>
      </h2>
    </div>

    <div class="grid sm:grid-cols-2 lg:grid-cols-3 gap-5">
      @for (benefit of benefits; track benefit.title) {
        <div appReveal class="benefit-card reveal {{ benefit.delay }}">
          <div class="benefit-icon" aria-hidden="true">
            <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path [attr.d]="benefit.iconPath" />
            </svg>
          </div>
          <h3 style="font-weight: 700; font-size: 1.05rem; margin-bottom: 0.5rem;">{{ benefit.title }}</h3>
          <p style="font-size: 0.875rem; color: #888; line-height: 1.7;">{{ benefit.desc }}</p>
        </div>
      }
    </div>

  </div>
</section>
