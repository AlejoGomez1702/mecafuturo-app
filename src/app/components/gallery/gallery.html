<section id="gallery" class="py-24" style="background: #111111;" aria-labelledby="gallery-title">
  <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">

    <div class="text-center mb-12">
      <div appReveal class="section-tag inline-flex reveal">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="#F5C400" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="2" /></svg>
        Nuestro trabajo
      </div>
      <h2 id="gallery-title" appReveal class="section-title mt-4 reveal delay-100">
        Proyectos que hablan<br />
        por <span class="text-yellow">nuestra calidad</span>
      </h2>
    </div>

    <div appReveal class="gallery-grid reveal delay-200">
      @for (item of items; track item.label) {
        <div
          class="gallery-item"
          tabindex="0"
          role="button"
          [attr.aria-label]="'Ver proyecto: ' + item.label"
          (click)="openLightbox(item)"
          (keydown.enter)="openLightbox(item)"
          (keydown.space)="openLightbox(item)"
        >
          <div class="gallery-emoji" aria-hidden="true">{{ item.emoji }}</div>
          <div class="gallery-overlay">
            <span style="color: #F5C400; font-size: 0.75rem; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase;">{{ item.category }}</span>
            <h3 style="font-weight: 700; margin-top: 0.25rem;">{{ item.title }}</h3>
          </div>
        </div>
      }
    </div>

  </div>
</section>

<!-- Lightbox -->
@if (selectedItem()) {
  <div
    class="lightbox-backdrop"
    role="dialog"
    aria-modal="true"
    aria-label="Imagen ampliada"
    (click)="closeLightbox()"
  >
    <button class="lightbox-close" aria-label="Cerrar" (click)="closeLightbox()">✕</button>
    <div style="text-align: center; padding: 2rem; max-width: 600px;" (click)="$event.stopPropagation()">
      <div style="font-size: 8rem; line-height: 1;" aria-hidden="true">{{ selectedItem()!.emoji }}</div>
      <p style="margin-top: 1.5rem; font-weight: 700; font-size: 1.1rem; color: white;">{{ selectedItem()!.label }}</p>
    </div>
  </div>
}
